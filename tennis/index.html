<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style></head><body><title>TCA · Tennis Coach Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app, black court-at-night ground (OLED-friendly), clay accent for the active block, ball-yellow for the live clock. Single dark look by design. */
:root {
  --bg: #050607;          /* near-black: saves battery on OLED */
  --panel: #111417;
  --line: #22282d;
  --fg: #e9ece8;
  --muted: #8a948f;
  --clay: #d8693a;        /* clay court: active block */
  --ball: #dbe85a;        /* ball yellow: running clock */
  --develop: #9cc0ea;     /* status colours from the roadmap */
  --stabilize: #f0d27a;
  --compete: #97d39a;
  --gap: #f0907f;
  --font-display: "Saira Condensed", "Arial Narrow", sans-serif-condensed, system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 28px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; box-sizing: border-box; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }

/* Session menu */
.sessions { display: grid; gap: 10px; }
.sess {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; text-align: left; width: 100%;
}
.sess .letter { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1; text-align: center; }
.sess .name { font-weight: 600; }
.sess .meta { color: var(--muted); font-size: .85rem; }
.sess .focus.develop, .sub.focus.develop { color: var(--develop); } .sess .focus.stabilize, .sub.focus.stabilize { color: var(--stabilize); } .sess .focus.compete { color: var(--compete); }
.sess .mins { font-family: var(--font-display); font-size: 1.4rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-right: 4px; background: var(--line); }
.tag.develop { color: var(--develop); } .tag.stabilize { color: var(--stabilize); } .tag.compete { color: var(--compete); }
.note { color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); padding-top: 12px; }

/* Session overview */
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.blocks li { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.blocks .t { font-family: var(--font-display); font-size: 1.15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.blocks .bn { font-weight: 600; }
.blocks .bd { color: var(--muted); font-size: .85rem; }
.blocks li.done { opacity: .4; }
.blocks li.now .t, .blocks li.now .bn { color: var(--clay); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 120px; padding: 16px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 1rem; min-height: 56px; }
.btn.primary { background: var(--clay); border-color: var(--clay); color: #111; }
.btn.ghost { background: transparent; }
.status { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.status b { color: var(--fg); font-weight: 600; }
.ok { color: var(--compete); } .warn { color: var(--stabilize); }

/* Running screen */
.live { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.blockname { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; text-transform: uppercase; color: var(--clay); text-wrap: balance; }
.blockdesc { color: var(--muted); font-size: .95rem; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(5rem, 30vw, 9rem); line-height: .9; color: var(--ball); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.clock.paused { color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--clay); width: 0; }
.next { font-size: .9rem; color: var(--muted); }
.next b { color: var(--fg); }
.total { font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
.rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.rec.on i { background: #e5484d; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .rec.on i { animation: none; } }

/* Home */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; width: 100%; display: grid; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile .k { font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .s { font-size: .75rem; color: var(--muted); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 28px; margin-top: 4px; }
.spark i { flex: 1; background: var(--line); border-radius: 2px 2px 0 0; min-height: 2px; }
.spark i.cur { background: var(--ball); }
.sec { display: grid; gap: 10px; }
.sec > .eyebrow { margin-bottom: -2px; }
.doc { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; text-align: left; width: 100%; }
.doc .name { font-weight: 600; } .doc .meta { color: var(--muted); font-size: .82rem; }
.doc .go { color: var(--muted); font-size: 1.3rem; }
.goalrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.goalrow .lv { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.pages img { width: 100%; display: block; border-radius: 6px; background: #fff; margin-bottom: 10px; }
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr 1fr; } .tiles .tile:last-child { grid-column: 1 / -1; } }

/* Documents formatted for the phone */
.docv { display: grid; gap: 12px; font-size: 1rem; line-height: 1.45; }
.docv p { margin: 0; }
.dv-meta { color: var(--muted); font-size: .85rem; }
.dv-hero { background: var(--panel); border-left: 4px solid var(--ball); padding: 14px 16px; border-radius: 0; display: grid; gap: 4px; }
.dv-big { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.05; text-transform: uppercase; color: var(--ball); text-wrap: balance; }
.dv-h { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 0; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.dv-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.dv-tile { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--clay); border-radius: 0 10px 10px 0; padding: 12px 14px; display: grid; gap: 3px; font-size: .92rem; color: var(--muted); }
.dv-k { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-top: 6px; }
.dv-tile .dv-k { margin-top: 0; color: var(--clay); }
.dv-strong { font-weight: 600; color: var(--fg); font-size: 1.02rem; }
.dv-strong2 { font-weight: 600; }
.dv-between { text-align: center; font-style: italic; color: var(--ball); padding: 6px 4px; }
.dv-between b { font-style: normal; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dv-list { display: grid; }
.dv-li { display: grid; grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.dv-chain { display: flex; flex-wrap: wrap; gap: 6px; }
.dv-chain span { font-size: .78rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--line); color: var(--muted); }
.dv-chain .develop { color: var(--develop); } .dv-chain .stabilize { color: var(--stabilize); } .dv-chain .compete { color: var(--compete); }
.chip { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); justify-self: start; }
.chip.develop { color: var(--develop); } .chip.stabilize { color: var(--stabilize); } .chip.compete { color: var(--compete); }
.dv-blocks { display: grid; gap: 10px; }
.dv-block { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 0 12px 12px 0; padding: 12px 14px; display: grid; gap: 3px; }
.dv-block.develop { border-left-color: var(--develop); } .dv-block.stabilize { border-left-color: var(--stabilize); } .dv-block.compete { border-left-color: var(--compete); }
.dv-bh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dv-num { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1; min-width: 1.1em; }
.dv-bn { font-weight: 600; font-size: 1.05rem; }
.dv-when { color: var(--muted); font-size: .82rem; }
.dv-dots { display: flex; gap: 5px; margin: 6px 0 2px; }
.dv-dots i { font-style: normal; width: 30px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--line); color: var(--muted); font-size: .8rem; font-weight: 600; }
.dv-dots i.goal { outline: 1.5px dashed var(--muted); outline-offset: -2px; }
.dv-dots i.on { background: var(--fg); color: var(--bg); outline: none; }
.dv-plan { display: grid; gap: 8px; }
.dv-step { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 10px; background: var(--panel); border-left: 4px solid var(--line); padding: 10px 12px; font-size: .92rem; color: var(--muted); }
.dv-step .dv-bn { color: var(--fg); font-size: 1rem; }
.dv-step.develop { border-left-color: var(--develop); } .dv-step.stabilize { border-left-color: var(--stabilize); } .dv-step.compete { border-left-color: var(--compete); }
.dv-min { white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.dv-goal { color: var(--fg); margin-top: 4px; font-weight: 500; }
.dv-goal::before { content: "Goal · "; color: var(--muted); font-weight: 400; }

/* Player profile */
.lvl, .pri { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--line); }
.lvl.strength { color: var(--compete); } .lvl.par { color: var(--stabilize); } .lvl.gap { color: var(--gap); }
.pri { color: var(--muted); background: transparent; border: 1px solid var(--line); } .pri.pa { color: var(--fg); border-color: var(--muted); }
.pf-quad { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.pf-q { background: var(--panel); border-top: 4px solid var(--line); padding: 12px 14px; font-size: .92rem; }
.pf-q.gap { border-top-color: var(--gap); } .pf-q.strength { border-top-color: var(--compete); } .pf-q.later { border-top-color: var(--muted); } .pf-q.maintain { border-top-color: var(--line); }
.pf-q .dv-k { margin-top: 0; } .pf-q ol, .pf-q ul { margin: 6px 0 0; padding-left: 1.2em; display: grid; gap: 3px; color: var(--muted); }
.pf-q.gap ol, .pf-q.strength ul { color: var(--fg); }
.pf-list { display: grid; }
.pf-group { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--clay); font-weight: 600; padding: 12px 0 2px; }
.pf-item { padding: 11px 0; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
.pf-item:not(.core) .dv-bn { font-weight: 500; color: var(--muted); }
.pf-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pf-tags { display: flex; gap: 5px; }
.pf-scores { display: flex; gap: 16px; flex-wrap: wrap; }
.pf-sc { display: grid; gap: 2px; } .pf-sc .dv-k { margin-top: 0; font-size: .62rem; }
.sc { display: inline-flex; align-items: center; gap: 3px; } .sc i { width: 12px; height: 12px; border-radius: 3px; background: var(--line); } .sc i.on { background: var(--fg); }
.sc b { font-size: .8rem; margin-left: 5px; font-variant-numeric: tabular-nums; } .sc.na { color: var(--muted); font-size: .8rem; }
.pf-c { color: var(--muted); font-size: .9rem; }
.pf-syn { background: var(--panel); border-left: 4px solid var(--ball); padding: 12px 14px; font-size: .93rem; }

/* Document navigation: appears when scrolling up */
.docnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); transform: translateY(-120%); opacity: 0; transition: transform .2s, opacity .2s; margin-top: -12px; pointer-events: none; }
.docnav.show { transform: none; opacity: 1; pointer-events: auto; }
.docnav button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: .9rem; padding: 6px; }
.docnav button[disabled] { opacity: .35; }
@media (prefers-reduced-motion: reduce) { .docnav { transition: none; } }

.btn.topic { flex: 0 0 auto; min-height: 40px; padding: 8px 14px; font-size: .88rem; font-weight: 500; }
.btn.topic.on { border-color: var(--ball); color: var(--ball); }

.btn.big { width: 100%; min-height: 84px; font-size: 1.2rem; flex: none; }
.btn.wide { width: 100%; flex: none; }
.transcript { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 3em; font-size: .95rem; white-space: pre-wrap; }
.transcript .interim { color: var(--muted); }

/* Home density: everything down to the Player Profile fits above the fold */
.hhead { display: flex; align-items: center; gap: 12px; }
.hhead h1 { font-size: 2.3rem; line-height: 1; }
.hhead .sub { font-size: .78rem; line-height: 1.3; margin: 0; }
.wrap:has(.hhead) { gap: 12px; padding-block: 14px 24px; }
.sec { gap: 8px; }
.dashcard { padding: 12px 14px; }
.tile { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tile .v { font-size: 1.45rem; white-space: nowrap; }
.tile .s { font-size: .72rem; line-height: 1.25; }
.tbar { margin-top: auto; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.tile .s { margin-bottom: 8px; }
.tbar > i { display: block; height: 100%; background: var(--ball); border-radius: 3px; }
.btn.big { min-height: 76px; }
.btn.slim { min-height: 50px; padding: 10px 14px; }
.docs .doc { padding: 9px 14px; }
.docs .doc .meta { font-size: .78rem; }
@media (max-width: 380px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tiles .tile:last-child { grid-column: auto; } .tile .v { font-size: 1.2rem; } }

/* Log */
pre.log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .85rem; white-space: pre-wrap; margin: 0; overflow-x: auto; font-variant-numeric: tabular-nums; }
.toast { color: var(--compete); font-size: .85rem; min-height: 1.2em; }
</style>

<script>
/* ---------------- Plan: Phase 1, valid Oct 2026 – end Q1 2027 ---------------- */
const PLAN = {
  A: { name: "Coach Focus Training", status: ["develop"], with: "Coach · 60 min · once a week", focus: "Develop · current focus: engine",
       blocks: [ { name: "Coach session", min: 60, desc: "Engine: loose wrist, racket-head lag, pace from dead balls. The coach decides the drills.", cue: "Coach session. Sixty minutes. Focus engine: loose wrist, let the racket swing." } ] },
  B: { name: "Practice with F&F", status: ["stabilize", "compete"], with: "Friends and family · 60 min · every week", focus: "Stabilize + Compete · current focus: depth and steering",
       blocks: [
         { name: "Connect", min: 10, desc: "Mini-tennis, then slow deep rally. A few balls with the three-finger grip; wrist hold between balls.", cue: "Connect. Ten minutes. Slow arm, clean contact, every ball past the service line." },
         { name: "Deep consistency", min: 10, desc: "Forehand first, then bring in the backhand. Game: 50 or 100 ball rally, or deep middle first to 20.", cue: "Deep consistency. Ten minutes. Forehand first, then the backhand." },
         { name: "Direction training", min: 10, desc: "Crosscourt rally, Hosenträger, or X crosscourt then Y down the line. Plus the steering test, once or twice: rally down your forehand line, two balls down the line, the third crosscourt from the forehand corner. Counts past the service line and inside the leftmost 2 m. 10 tries, say the count.", cue: "Direction training. Ten minutes. Find the cross angle. Steering test once or twice: two down the line, third one crosscourt. Say the count." },
         { name: "Direction under pressure", min: 10, desc: "Move and counter crosscourt, or the line-right game. Optionally as an Elfer.", cue: "Direction under pressure. Ten minutes. Deep crosscourt when you are pushed wide." },
         { name: "Match play", min: 20, desc: "Tiebreaks or match tiebreaks with the Match Card. Deep ball wins count double.", cue: "Match play. Twenty minutes. Three deep balls win the point." } ] },
  C: { name: "Serve Session", status: ["stabilize"], with: "Alone, on court · 60 min · every week", focus: "Stabilize · current focus: kick and flat T",
       blocks: [
         { name: "Set-up and warm-up", min: 5, desc: "Targets at T, body, wide and long. Shoulder warm-up, shadow serves.", cue: "Set up and warm up. Five minutes." },
         { name: "Target practice", min: 20, desc: "From the centre: 10 serves at each target in turn, both sides. Count the hits.", cue: "Target practice. Twenty minutes. Ten serves per target. From the knees, core through the ball." },
         { name: "Target sequence", min: 35, desc: "Deuce: flat T twice, kick wide twice. Then ad side. Keep alternating.", cue: "Target sequence. Thirty five minutes. Flat down the T twice, kick wide twice, then switch sides." } ] },
  D: { name: "Tennis Wall Session", status: ["develop", "stabilize"], with: "Alone · 60 min · every second week", focus: "Develop + Stabilize · current focus: engine and serve",
       blocks: [
         { name: "Loosen", min: 5, desc: "Shake out, shadow swings at grip pressure three of ten, wrist hold.", cue: "Loosen. Five minutes. Grip pressure three out of ten. Listen for the swoosh." },
         { name: "Drop-feed whip", min: 15, desc: "Three-finger grip, early preparation, exhale through contact. Waist-high first, then higher balls.", cue: "Drop feed whip. Fifteen minutes. Three finger grip, early preparation, breathe out through contact." },
         { name: "Slow ball off the wall", min: 10, desc: "Play it soft, let it come back slow, accelerate through it with the whip.", cue: "Slow ball off the wall. Ten minutes. Stay relaxed, let the racket swing." },
         { name: "Serve targets", min: 30, desc: "Target on the wall at T height: flat down the T twice, kick down the T twice.", cue: "Serve targets. Thirty minutes. Flat down the T twice, kick down the T twice." } ] }
};

/* ---------------- State ---------------- */
const S = { view: "menu", key: null, i: 0, running: false, blockStart: 0, blockElapsed: 0, sessionStart: 0,
            pausedAt: 0, pausedTotal: 0, log: [], warned: false, wake: null, rec: null, chunks: [], recMime: "",
            recState: "off", audio: null, downloads: null, tick: null, finished: false };
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); };
const fmtH = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); };
const plan = () => PLAN[S.key];
const totalMin = k => PLAN[k].blocks.reduce((a, b) => a + b.min, 0);
const now = () => Date.now();
function sessionSecs() { if (!S.sessionStart) return 0; const end = S.running ? now() : (S.pausedAt || now()); return (end - S.sessionStart - S.pausedTotal) / 1000; }

/* ---------------- Speech ---------------- */
let voice = null;
function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en-GB/i.test(v.lang) && /Daniel|Serena|Kate|Arthur/i.test(v.name)) || vs.find(v => /^en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {}
}
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function say(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; if (voice) u.voice = voice; u.rate = 0.98; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}

    $("reload").onclick = hardReload;
    app.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => { S.doc = b.dataset.doc; S.view = "doc"; render(); });
    activity().then(a => {
      const t = $("tiles"); if (!t) return;
      const n = a.sessions.length;
      const tile = (k, v, sub, pct) => '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + sub + '</div><div class="bar tbar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div></div>';
      t.innerHTML = tile("Progress", n < 6 ? n + "/6" : "6/6", n < 6 ? "sessions to first read" : "awaiting analysis", 100 * Math.min(n, 6) / 6) +
        tile("This week", fmtHM(a.thisWeek) + " h", "of " + WEEK_GOAL_H + ":00 h goal", 100 * a.thisWeek / WEEK_GOAL_H) +
        tile("6 weeks", fmtHM(a.avg6) + " h", "avg per week · " + a.trend.toLowerCase(), 100 * a.avg6 / WEEK_GOAL_H);
      const b = $("saved"), nx = a.all.filter(r => driveUrl() ? !r.uploaded : !r.exported).length; if (b) b.textContent = "Saved sessions" + (a.all.length ? " · " + a.all.length + (nx ? " (" + nx + (driveUrl() ? " not uploaded)" : " not exported)") : "") : "");
    });
  } else if (S.view === "insight") {
    const TOPICS = ["Match Card", "Roadmap", "Weekly Schedule", "Player Profile", "Technique", "Other"];
    const rec = S.insRec;
    app.innerHTML = '<header><div class="eyebrow">Insight</div><h1>Record an insight</h1><p class="sub">A voice note for your next coaching review, e.g. a change to the Match Card from a talk with your coach. It never counts as training.</p></header>' +
      '<div class="sec"><div class="eyebrow">About (optional)</div><div class="row" id="topics">' + TOPICS.map(t => '<button class="btn ghost topic' + (S.insTopic === t ? " on" : "") + '" data-t="' + t + '"' + (rec ? " disabled" : "") + '>' + t + '</button>').join("") + '</div></div>' +
      '<div class="clock" id="iclock" style="text-align:center;color:' + (rec ? "var(--ball)" : "var(--muted)") + '">' + (rec ? fmt((now() - S.insStart) / 1000) : "0:00") + '</div>' +
      '<div class="row"><button class="btn primary" id="irec">' + (rec ? "Stop and save" : "Start recording") + '</button></div>' +
      '<div class="toast" id="toast"></div><div class="status" id="istat"></div>' +
      (rec ? "" : '<div class="row"><button class="btn ghost" id="home">Back</button></div>');
    app.querySelectorAll(".topic").forEach(b => b.onclick = () => { S.insTopic = S.insTopic === b.dataset.t ? "" : b.dataset.t; render(); });
    if ($("home")) $("home").onclick = () => { S.view = "menu"; render(); };
    $("irec").onclick = rec ? stopInsight : startInsight;
  } else if (S.view === "training") {
    app.innerHTML = '<header><div class="eyebrow">Training</div><h1>Pick a session</h1><p class="sub">Cues play through your AirPods.</p></header>' +
      '<div class="sessions">' + Object.keys(PLAN).map(k => { const p = PLAN[k]; return '<button class="sess" id="s-' + k + '" data-k="' + k + '"><span class="letter">' + k + '</span><span><span class="name">' + p.name + '</span><br><span class="meta">' + p.with + '</span><br><span class="meta focus ' + p.status[0] + '">' + p.focus + '</span></span></button>'; }).join("") + "</div>" +
      '<p class="note">Before you start: Low Power Mode off, AirPods in, phone in the shade. The screen stays on, and every session is saved and uploaded automatically.</p>' +
      '<div class="row"><button class="btn ghost" id="home">Back</button></div>';
    app.querySelectorAll(".sess").forEach(b => b.onclick = () => { S.key = b.dataset.k; S.view = "overview"; render(); });
    $("home").onclick = () => { S.view = "menu"; render(); };
  } else if (S.view === "dashboard") {
    app.innerHTML = '<header><div class="eyebrow">Dashboard</div><h1>Progress</h1><p class="sub">Levels and trends appear once your recordings are analysed. A level needs 5 sessions, a trend 6. Sessions under 15 minutes don\'t count.</p></header><div id="db" class="card">Loading…</div><div class="row"><button class="btn ghost" id="home">Back</button></div>';
    $("home").onclick = () => { S.view = "menu"; render(); };
    activity().then(a => {
      const g = (name, n, need, test) => '<div class="goalrow"><span><b>' + name + '</b><br><span class="s" style="color:var(--muted);font-size:.8rem">' + test + '</span></span><span class="lv">' + (n < need ? "–" : "–") + '</span><span class="s" style="color:var(--muted);font-size:.8rem;grid-column:1/-1">' + n + ' session' + (n === 1 ? "" : "s") + ' so far · ' + (n < need ? (need - n) + " more until first level" : "waiting for analysis") + '</span></div>';
      $("db").innerHTML = '<div class="tiles"><div class="tile"><div class="k">This week</div><div class="v">' + fmtHM(a.thisWeek) + '</div><div class="s">of ' + WEEK_GOAL_H + ':00 h</div></div><div class="tile"><div class="k">6-week avg</div><div class="v">' + fmtHM(a.avg6) + '</div><div class="s">h per week</div></div><div class="tile"><div class="k">Activity</div><div class="v" style="font-size:1.25rem">' + a.trend + '</div>' + spark(a.weeks) + '</div></div>' +
        g("Serve", a.serveN, 5, "Graduation: kick 8/10, first serve 50%") + g("Depth", a.depthN, 5, "Time to 20 and longest rally") + g("Steering", a.steerN, 5, "Graduation: steering test 8/10");
    });
  } else if (S.view === "doc") {
    const d = DOCS.find(x => x.id === S.doc), di = DOCS.indexOf(d);
    app.innerHTML = '<nav class="docnav" id="docnav" aria-label="Documents"><button id="dprev"' + (di ? "" : " disabled") + '>‹ ' + (di ? DOCS[di - 1].short : "Previous") + '</button><button id="dhome">Home</button><button id="dnext"' + (di < DOCS.length - 1 ? "" : " disabled") + '>' + (di < DOCS.length - 1 ? DOCS[di + 1].short : "Next") + ' ›</button></nav><header><div class="eyebrow">Document</div><h1 style="font-size:1.6rem">' + d.name + '</h1></header><div class="pages" id="pages"><p class="sub">Opening…</p></div><div class="row"><button class="btn ghost" id="home">Back</button></div>';
    $("home").onclick = () => { S.view = "menu"; render(); };
    $("dhome").onclick = () => { S.view = "menu"; render(); scrollTo(0, 0); };
    $("dprev").onclick = () => { if (di) { S.doc = DOCS[di - 1].id; render(); scrollTo(0, 0); } };
    $("dnext").onclick = () => { if (di < DOCS.length - 1) { S.doc = DOCS[di + 1].id; render(); scrollTo(0, 0); } };
    openDoc(d.id).then(doc => { const el = $("pages"); if (!el) return; if (doc.html) { el.className = "docv"; el.innerHTML = doc.html; return; } el.innerHTML = '<p class="sub">Pinch to zoom.</p>' + doc.pages.map((p, i) => '<img alt="' + d.name + ' page ' + (i + 1) + '" src="data:image/jpeg;base64,' + p + '">').join(""); })
      .catch(e => { const el = $("pages"); if (el) el.innerHTML = '<p class="sub">' + (e.message === "nokey" ? "Connect Google Drive under Saved sessions first. The documents open with the same private key." : "Could not open the document. Check your connection and try again.") + '</p>'; });
  } else if (S.view === "saved") {
    app.innerHTML = '<header><div class="eyebrow">On this phone</div><h1>Saved sessions</h1><p class="sub">Saved automatically. Export sends recording and log to Files in one go.</p></header>' +
      '<div class="status"><div><b>Google Drive</b> · ' + (driveUrl() ? '<span class="ok">Connected. Sessions upload automatically.</span>' : 'Not connected') + '</div>' +
      '<div class="row" style="margin-top:8px"><input id="du" placeholder="Paste your script link" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #333;background:transparent;color:inherit;font:inherit" value="' + (driveUrl() ? "••• connected •••" : "") + '"><button class="btn" id="dsave">' + (driveUrl() ? "Change" : "Connect") + '</button>' + (driveUrl() ? '<button class="btn" id="dsync">Upload now</button>' : '') + '</div></div>' +
      '<div class="row"><button class="btn primary" id="exn">Export all new</button></div><div id="list" class="sessions"></div><div class="toast" id="toast"></div>' +
      '<div class="row"><button class="btn ghost" id="home">Back</button></div>';
    $("home").onclick = () => { S.view = "menu"; render(); };
    $("du").onfocus = () => { if ($("du").value.startsWith("•")) $("du").value = ""; };
    $("dsave").onclick = async () => { const v = $("du").value.trim(); if (!v || v.startsWith("•")) { toast("Paste the link first."); return; } toast("Checking…"); const err = await testDrive(v); if (err) { toast(err); return; } setDriveUrl(v); toast("Connected."); render(); syncDrive(true); };
    if ($("dsync")) $("dsync").onclick = () => { toast("Uploading…"); syncDrive(true); };
    allSessions().then(l => {
      const list = $("list"); if (!list) return;
      if (!l.length) { list.innerHTML = '<p class="note">No sessions yet.</p>'; $("exn").disabled = true; return; }
      $("exn").onclick = () => exportSessions(l.filter(r => !r.exported));
      $("exn").disabled = !l.some(r => !r.exported);
      list.innerHTML = l.map(r => '<div class="sess" style="cursor:default"><span class="letter"' + (r.type === "insight" ? ' style="font-size:1rem;color:var(--ball)">Insight' : '>' + r.key) + '</span><span><span class="name">' + new Date(r.start).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + '</span><br><span class="meta">' + fmtH(r.secs) + (r.done ? "" : " · interrupted") + ((r.secs || 0) < MIN_SECS ? " · under 15 min, not counted" : "") + (r.uploaded ? " · in Drive" : (driveUrl() ? " · not uploaded yet" : "")) + (r.exported ? " · exported" : "") + '</span></span><span class="row" style="gap:6px"><button class="btn" data-ex="' + r.id + '">Export</button><button class="btn ghost" data-del="' + r.id + '">Delete</button></span></div>').join("");
      list.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => exportSessions(l.filter(r => r.id === b.dataset.ex)));
      list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Sure?"; return; } await deleteSession(b.dataset.del); render(); });
    });
  } else if (S.view === "overview") {
    const p = plan(); let t = 0;
    app.innerHTML = '<header><div class="eyebrow">Session ' + S.key + ' · ' + p.with + '</div><h1>' + p.name + '</h1><p class="sub focus ' + p.status[0] + '">' + p.focus + '</p></header>' +
      '<ol class="blocks">' + p.blocks.map(b => { const s = '<li><span class="t">' + fmt(t * 60) + '</span><span><span class="bn">' + b.name + ' · ' + b.min + ' min</span><br><span class="bd">' + b.desc + '</span></span></li>'; t += b.min; return s; }).join("") + "</ol>" +
      '<div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="go">Start session</button></div>' +
      '<div class="status" id="status"></div>';
    $("back").onclick = () => { S.view = "training"; render(); };
    $("go").onclick = start;
    renderStatus();
  } else if (S.view === "live") {
    app.innerHTML = '<div class="live">' +
      '<div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow">Session ' + S.key + ' · Block <span id="bi"></span></span><span class="rec" id="rec"><i></i><span id="rect"></span></span></div>' +
      '<div><div class="blockname" id="bn"></div><div class="blockdesc" id="bd"></div></div>' +
      '<div class="clock" id="clock">0:00</div>' +
      '<div class="bar"><i id="bar"></i></div>' +
      '<div class="next" id="next"></div>' +
      '<div class="total">Session <span id="tot">00:00</span></div>' +
      '<div class="row"><button class="btn" id="prev">◀ Block</button><button class="btn" id="pp">Pause</button><button class="btn" id="nxt">Block ▶</button></div>' +
      '<div class="row"><button class="btn" id="mk">Mark moment</button><button class="btn ghost" id="end">End session</button></div>' +
      '<div class="toast" id="toast"></div><div class="status" id="status"></div></div>';
    $("prev").onclick = () => skip(-1); $("nxt").onclick = () => skip(1); $("pp").onclick = pause; $("mk").onclick = mark;
    $("end").onclick = () => { const b = $("end"); if (b.dataset.armed) finish(false); else { b.dataset.armed = "1"; b.textContent = "Tap again to end"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "End session"; } }, 3000); } };
    renderLive(); renderStatus();
  } else if (S.view === "done") {
    const hasAudio = S.chunks.length > 0;
    app.innerHTML = '<header><div class="eyebrow">Session ' + S.key + ' · ' + fmtH(sessionSecs()) + '</div><h1>Session done</h1><p class="sub">Saved on this phone.</p><div class="status" id="drv">' + (driveUrl() ? 'Uploading to Google Drive…' : 'Google Drive not connected. Set it up under Saved sessions.') + '</div></header>' +
      '<pre class="log" id="log"></pre>' +
      '<div class="row"><button class="btn primary" id="ex">Export to Files</button><button class="btn" id="cl">Copy log</button></div>' +
      '<div class="toast" id="toast"></div>' +
      (hasAudio ? '' : '<p class="note">No recording on this page. Tip: start Voice Memos before the session and use these timestamps to find each block.</p>') +
      '<div class="row"><button class="btn ghost" id="home">Back to sessions</button></div>';
    $("log").textContent = logText();
    $("cl").onclick = copyLog;
    $("ex").onclick = async () => { const l = await allSessions(); exportSessions(l.filter(r => r.id === S.sid)); };
    $("home").onclick = () => { S.view = "menu"; S.chunks = []; render(); };
  }
}
function renderLive() {
  if (S.view !== "live") return;
  const p = plan(), b = p.blocks[S.i], left = b.min * 60 - blockSecs();
  $("bi").textContent = (S.i + 1) + " of " + p.blocks.length;
  $("bn").textContent = b.name; $("bd").textContent = b.desc;
  $("clock").textContent = fmt(left); $("clock").classList.toggle("paused", !S.running);
  $("bar").style.width = Math.min(100, 100 * blockSecs() / (b.min * 60)) + "%";
  const nb = p.blocks[S.i + 1];
  $("next").innerHTML = nb ? "Next: <b>" + nb.name + "</b> · " + nb.min + " min" : "Last block";
  $("tot").textContent = fmtH(sessionSecs());
  $("pp").textContent = S.running ? "Pause" : "Resume";
  const r = $("rec"); r.classList.toggle("on", S.recState === "on" && S.running);
  $("rect").textContent = S.recState === "on" ? (S.running ? "Recording" : "Rec paused") : "No recording";
}
function renderStatus() {
  const el = $("status"); if (!el) return;
  const wl = "wakeLock" in navigator;
  const screen = S.wake ? '<span class="ok">Screen stays on</span>' : (wl ? (S.running ? '<span class="warn">Screen lock not held. Tap the screen once.</span>' : 'Screen will stay on once the session starts') : '<span class="warn">This browser cannot keep the screen on. Set Auto-Lock to Never for the session.</span>');
  const rec = S.recState === "on" ? '<span class="ok">Recording</span>' : (S.recState === "off" ? "Recording starts with the session if this page may use the microphone" : '<span class="warn">No microphone on this page. Use Voice Memos alongside.</span>');
  el.innerHTML = "<div><b>Screen</b> · " + screen + "</div><div><b>Audio</b> · " + rec + "</div>";
}

/* ---------------- Updates: fetch the newest version whenever the app opens ---------------- */
const APP_VERSION = "2026-10-14-12";
async function hardReload() {
  toast("Loading the newest version…");
  try { await fetch("index.html?" + Date.now(), { cache: "reload" }); await fetch("./", { cache: "reload" }); } catch (e) {}
  location.replace(location.pathname + "?r=" + Date.now());
}
async function checkUpdate() {
  if (S.view === "live" || S.view === "overview" || S.view === "done" || S.insRec) return;
  try {
    const v = (await (await fetch("version.txt?" + Date.now(), { cache: "no-store" })).text()).trim();
    if (!v || v === APP_VERSION) return;
    let tried = ""; try { tried = sessionStorage.getItem("ct-upd") || ""; } catch (e) {}
    if (tried === v) return;
    try { sessionStorage.setItem("ct-upd", v); } catch (e) {}
    await fetch("./", { cache: "reload" }); await fetch("index.html", { cache: "reload" });
    location.replace(location.pathname + "?v=" + encodeURIComponent(v));
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });

/* ---------------- Gestures and scrolling ---------------- */
let lastY = 0;
addEventListener("scroll", () => {
  const n = $("docnav"), y = scrollY;
  if (n) { if (y <= 80 || y > lastY + 2) n.classList.remove("show"); else if (y < lastY - 2) n.classList.add("show"); }
  lastY = y;
}, { passive: true });
let sw = null;
addEventListener("touchstart", e => { sw = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null; }, { passive: true });
addEventListener("touchend", e => {
  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  if (Math.abs(dx) < 80 || Math.abs(dy) > Math.abs(dx) * 0.5 || dt > 700) return;
  if (S.view === "menu" || S.view === "live" || S.insRec) return;   // never leave a running session by accident
  if (S.view === "done") S.chunks = [];
  S.view = "menu"; render(); scrollTo(0, 0);
}, { passive: true });

/* ---------------- Boot ---------------- */
render();
checkUpdate();
setTimeout(() => syncDrive(false), 1500);
(async () => { try { if (window.claude && claude.use) S.downloads = await claude.use("downloads"); } catch (e) { S.downloads = null; } })();
</script>
</body></html>
